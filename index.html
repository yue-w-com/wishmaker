<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Ever Given Wishes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓︎</text></svg>">
</head>
<body>
  <div class="floaties" aria-hidden="true">
    <span style="top:4%;left:4%">☆</span>
    <span style="top:9%;right:5%">(｡•̀ᴗ-)✧</span>
    <span style="top:38%;left:-6px">⚓︎</span>
    <span style="top:55%;right:3%">ฅ^•ﻌ•^ฅ</span>
    <span style="bottom:12%;left:5%">(っ˘ω˘ς)</span>
    <span style="bottom:4%;right:8%">✧･ﾟ:*</span>
    <span style="top:24%;right:14%">✦</span>
  </div>

  <main class="wrap">
    <section class="card">
      <div class="hero">
        <span class="kao-big">⚓︎ (ﾉ◕ヮ◕)ﾉ*:･ﾟ✧</span>
        <svg class="ship-art" viewBox="0 0 150 64" aria-hidden="true" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 40 h110 l-12 14 H32 z" fill="#fff"/>
          <rect x="40" y="26" width="16" height="14" rx="2" fill="#fff"/>
          <rect x="58" y="22" width="16" height="18" rx="2" fill="#fff"/>
          <rect x="76" y="28" width="16" height="12" rx="2" fill="#fff"/>
          <rect x="96" y="18" width="14" height="22" rx="3" fill="#111"/>
          <path d="M103 18 v-8"/>
          <circle cx="103" cy="7" r="2" fill="#111"/>
          <path d="M6 60 q8 -6 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
          <path d="M18 12 l2 5 5 1 -5 1 -2 5 -2 -5 -5 -1 5 -1 z" fill="#111" stroke-width="1"/>
          <path d="M132 6 l1.5 3.5 3.5 1 -3.5 1 -1.5 3.5 -1.5 -3.5 -3.5 -1 3.5 -1 z" fill="#111" stroke-width="1"/>
        </svg>
        <h1>Ahoy!<span class="ship">Welcome to Ever Given!</span></h1>
        <p>Captain Oh is collecting wishes from all seven seas &amp; stars ☆彡</p>
      </div>

      <div class="rope" aria-hidden="true"></div>

      <form id="wishForm" novalidate>
        <label class="field">
          <span>What's your name? <span class="kao">(・ω・)ノ</span></span>
          <input id="name" name="name" type="text" required maxlength="40" autocomplete="nickname" placeholder="e.g. Little Star">
        </label>

        <label class="field">
          <span>What's your wish? <span class="kao">(〃∀〃)</span></span>
          <textarea id="wish" name="wish" required maxlength="200" placeholder="I wish..."></textarea>
          <div class="counter"><span id="count">0</span> / 200</div>
        </label>

        <button id="sendBtn" class="btn block" type="submit" disabled>Tell Captain Oh ⚓︎</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>

      <div id="done" class="success hidden" role="status" aria-live="polite">
        <span class="kao-big">☆ﾐ(o*･ω･)ﾉ</span>
        <h2>Your wish is sailing to the stars!</h2>
        <p>Look up at the big screen～ <span class="kao">(｡♥‿♥｡)</span></p>
        <div class="echo" id="echo"></div>
        <button id="againBtn" class="btn ghost block" type="button">Make another wish ✧</button>
      </div>
    </section>

    <p class="footer">for, ever ・ Ever Given ・ <span class="kao">☆*:.｡.o(≧▽≦)o.｡.:*☆</span></p>
  </main>

  <script type="module" src="js/client.js"></script>
</body>
</html>
